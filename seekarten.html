<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seekarten prüfen</title>
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { position: static; overflow: auto; height: auto; }
  body { background: #f6ecd2; font: 15px system-ui, sans-serif; padding: 16px; -webkit-user-select: text; user-select: text; }
  h1 { font-size: 22px; } h2 { font-size: 18px; margin: 18px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  figure { width: 210px; background: #fff; border: 2px solid #3b2a20; border-radius: 10px; padding: 6px; }
  figure.bad { background: #ffd9cf; }
  figure .board-svg { width: 100%; }
  figcaption { font-size: 12px; line-height: 1.3; }
  .sum { font-weight: 700; }
</style>
</head>
<body>
<h1>Seekarten prüfen</h1>
<p>Entwicklerseite: zeigt alle handgebauten Karten aus <code>content/seekarten.json</code> mit ihrer kürzesten Lösung und meldet Fehler (rot).</p>
<p class="sum" id="sum"></p>
<div id="out"></div>
<script type="module">
  import { parseLevel, analyse, SETS, transformDef, winningRules, runRule, generate, makePrediction, breakPlan, run } from './js/games/seekarte.js';
  import { boardSvg } from './js/art/sea.js';
  const fmt = prog => prog.map(n => n.op === 'loop' ? `(${n.body.map(b => b.op).join(' ')})×${n.n}` : n.op).join(' ');
  const data = await (await fetch('content/seekarten.json')).json();
  const out = document.getElementById('out');
  let bad = 0, total = 0;
  for (const [set, cfg] of Object.entries(SETS)) {
    let html = `<h2>${set} (${cfg.mode}${cfg.sizes.length ? ', Strudel ' + cfg.sizes.join('/') : ''})</h2><div class="row">`;
    data[set].forEach((def, i) => {
      total++;
      const lv = parseLevel({ ...def, set, id: set + '-' + i });
      const an = analyse(lv, cfg.mode, cfg.sizes);
      const errs = [];
      if (!lv.start || !lv.goal) errs.push('Start oder Schatz fehlt');
      if (!an) errs.push('nicht lösbar');
      else {
        if (an.length < cfg.len[0] || an.length > cfg.len[1]) errs.push(`Länge ${an.length} außerhalb ${cfg.len.join('–')}`);
        const slots = cfg.slots || (cfg.tight ? an.minSlots + 1 : 10);
        if (an.minSlots > slots) errs.push(`braucht ${an.minSlots} Plätze, hat ${slots}`);
        if (cfg.slots && an.length <= cfg.slots) errs.push('geht auch ohne Strudel');
        if (cfg.sizes.length && !an.solution.some(n => n.op === 'loop')) errs.push('Lösung ohne Strudel');
        if (run(lv, an.solution).result !== 'win') errs.push('Lösung gewinnt nicht');
      }
      if (errs.length) bad++;
      html += `<figure class="${errs.length ? 'bad' : ''}">${boardSvg(lv, { mode: cfg.mode })}<figcaption>
        <b>${set}-${i}</b> · Länge ${an ? an.length : '–'} · Plättchen ${an ? an.par : '–'} · Plätze ${an ? an.minSlots : '–'}<br>
        ${an ? fmt(an.solution) : ''}<br><b style="color:#c00">${errs.join(', ')}</b></figcaption></figure>`;
    });
    out.insertAdjacentHTML('beforeend', html + '</div>');
  }
  // Ausguck: rechtsdrehende Grundkarten – nur „Felsen: rechts, frei: vorwärts" darf gewinnen.
  let html = '<h2>ausguck (Grundkarten rechtsherum, dazu gedreht und gespiegelt)</h2><div class="row">';
  data.ausguck.forEach((def, i) => {
    for (let rot = 0; rot < 4; rot++) for (const flip of [false, true]) {
      total++;
      const lv = parseLevel(transformDef(def, rot, flip));
      const wins = winningRules(lv);
      const want = flip ? 'tl' : 'tr';
      const ok = wins.length === 1 && wins[0].blocked === want && wins[0].free === 'fwd';
      if (!ok) bad++;
      if (rot === 0 || !ok) html += `<figure class="${ok ? '' : 'bad'}">${boardSvg(lv, { mode: 'rel' })}<figcaption><b>ausguck-${i}</b> ${rot * 90}° ${flip ? 'gespiegelt' : ''}<br>
        gewinnt mit: ${wins.map(w => w.blocked + '/' + w.free).join(', ') || 'nichts'}</figcaption></figure>`;
    }
  });
  out.insertAdjacentHTML('beforeend', html + '</div>');
  // Zufallskarten und abgeleitete Aufgaben stichprobenartig
  let gen = 0, genBad = 0;
  for (let k = 0; k < 200; k++) { gen++; const lv = generate({ w: 6, h: 5, min: 4, max: 8, coins: k % 2 }); if (!lv || !analyse(lv, 'abs')) genBad++; }
  let derived = 0, derivedBad = 0;
  for (const set of ['reise', 'kurven']) data[set].forEach(def => {
    const mode = SETS[set].mode;
    const lv = parseLevel(def);
    const an = analyse(lv, mode);
    derived += 2;
    if (!makePrediction({ ...lv, coins: [] }, mode, 4)) derivedBad++;
    if (!breakPlan(lv, an.solution, 'wrong', mode)) derivedBad++;
  });
  bad += genBad + derivedBad;
  document.getElementById('sum').textContent = `${total} Karten, ${bad} Fehler · Zufallskarten: ${gen - genBad}/${gen} lösbar · abgeleitete Aufgaben: ${derived - derivedBad}/${derived} ok`;
</script>
</body>
</html>
